version: '3.8'

services:
  db:
    image: postgres:15
    container_name: detectcallcenter_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: callcenter_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: detectcallcenter_backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password@db:5432/callcenter_db
    depends_on:
      - db
    volumes:
      - ./backend:/app

  frontend:
    image: nginx:alpine
    container_name: detectcallcenter_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  pgdata: