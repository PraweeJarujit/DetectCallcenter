# Nginx สำหรับเสิร์ฟ frontend (static) + reverse proxy /api -> backend
# frontend กับ API จึงอยู่ origin เดียวกัน: ไม่ติด CORS และ browser ไม่ต้องรู้ที่อยู่ backend
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;   # ไฟล์เสียง /detect/audio สูงสุด 10 MB

    # ---- Security headers (Week 11-12: XSS / clickjacking / MIME sniffing) ----
    # หน้าเว็บมี inline <script>/<style> จึงต้องอนุญาต 'unsafe-inline' — แต่ยังจำกัด
    # ให้โหลด script/เชื่อมต่อได้เฉพาะ origin ตัวเอง และฟอนต์จาก Google Fonts เท่านั้น
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # หน้าแรก = index.html (ตัวตรวจ + ราคา + ติดต่อเรา) / ลิงก์หน้าเก่าพาไปหน้าใหม่
    location = /pages/dashboard.html { return 301 /pages/check.html; }
    location = /pages/call-demo.html { return 301 /index.html; }
    location = /pages/settings.html { return 301 /pages/account.html; }
    location = /pages/blacklist.html { return 301 /pages/numbers.html; }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;    # วิเคราะห์ไฟล์เสียงยาวอาจใช้เวลา
    }

    # ไฟล์ static: cache ได้ แต่ HTML ให้ตรวจใหม่ทุกครั้ง (deploy แล้วเห็นของใหม่ทันที)
    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ห้ามเข้าถึงไฟล์ซ่อน / ไฟล์ config
    location ~ /\.(?!well-known) { deny all; }
    location = /nginx.conf { deny all; }
}
