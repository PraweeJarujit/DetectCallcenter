<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ | VoiceGuard AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="logo-mark" style="width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;">🛡️</span>
      <strong>VoiceGuard AI</strong>
    </div>
    <h1 id="auth-title">เข้าสู่ระบบสำหรับหน่วยงาน</h1>
    <p class="subtitle" id="auth-subtitle">เข้าสู่ระบบเพื่อดูแดชบอร์ดที่ปรับให้เหมาะกับหน่วยงานของคุณ</p>

    <!-- โหมดสมัครสมาชิก: เลือกประเภทหน่วยงาน (role) -->
    <div class="role-tabs" id="role-tabs" hidden>
      <div class="role-tab active" data-role="gov">หน่วยงานรัฐ</div>
      <div class="role-tab" data-role="bank">ธนาคาร</div>
      <div class="role-tab" data-role="telco">Telco</div>
    </div>

    <form id="auth-form" novalidate>
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน</label>
        <input type="text" id="username" placeholder="เช่น officer.somchai" value="officer.demo"
               autocomplete="username" required minlength="3" maxlength="50" pattern="[A-Za-z0-9._\-]+">
        <div class="field-error" data-for="username"></div>
      </div>
      <div class="form-group register-only" hidden>
        <label for="email">อีเมล</label>
        <input type="email" id="email" placeholder="name@agency.go.th" autocomplete="email">
        <div class="field-error" data-for="email"></div>
      </div>
      <div class="form-group register-only" hidden>
        <label for="full_name">ชื่อ-นามสกุล (ไม่บังคับ)</label>
        <input type="text" id="full_name" maxlength="150" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <input type="password" id="password" placeholder="••••••••" value="demo1234"
               autocomplete="current-password" required>
        <div class="field-error" data-for="password"></div>
      </div>
      <div class="form-error" id="form-error" role="alert" hidden></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">เข้าสู่ระบบ</button>
    </form>

    <p class="form-hint">
      <a href="#" id="mode-switch" style="color:var(--navy);font-weight:600;">ยังไม่มีบัญชี? สมัครสมาชิก</a><br>
      บัญชีทดลอง: <code>officer.demo</code> / <code>demo1234</code> · admin: <code>admin</code> / <code>Admin1234</code><br>
      หรือ <a href="call-demo.html" style="color:var(--navy);font-weight:600;">ทดลองใช้งาน Demo ทันที</a> โดยไม่ต้อง login
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  let mode = "login"; // login | register
  let selectedRole = "gov";
  const $ = (id) => document.getElementById(id);

  /* ไปหน้าที่ผู้ใช้ตั้งใจจะเข้าก่อนโดนเด้งมา login — รับเฉพาะชื่อไฟล์ในเว็บเรา (กัน open redirect) */
  function nextPage() {
    const next = new URLSearchParams(location.search).get("next") || "";
    return /^[a-z-]+\.html(\?[\w=&%-]*)?$/.test(next) ? next : "dashboard.html";
  }

  // login อยู่แล้ว -> ไป dashboard เลย
  if (getToken() && getCurrentUser()) window.location.replace(nextPage());

  document.querySelectorAll(".role-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".role-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      selectedRole = tab.dataset.role;
    });
  });

  function setMode(next) {
    mode = next;
    const reg = mode === "register";
    $("role-tabs").hidden = !reg;
    document.querySelectorAll(".register-only").forEach((el) => (el.hidden = !reg));
    $("auth-title").textContent = reg ? "สมัครสมาชิกสำหรับหน่วยงาน" : "เข้าสู่ระบบสำหรับหน่วยงาน";
    $("auth-subtitle").textContent = reg
      ? "เลือกประเภทหน่วยงาน แล้วกรอกข้อมูลเพื่อสร้างบัญชี"
      : "เข้าสู่ระบบเพื่อดูแดชบอร์ดที่ปรับให้เหมาะกับหน่วยงานของคุณ";
    $("submit-btn").textContent = reg ? "สมัครสมาชิก" : "เข้าสู่ระบบ";
    $("mode-switch").textContent = reg ? "มีบัญชีแล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครสมาชิก";
    $("password").autocomplete = reg ? "new-password" : "current-password";
    if (reg) { $("username").value = ""; $("password").value = ""; }
    clearErrors();
  }

  $("mode-switch").addEventListener("click", (e) => {
    e.preventDefault();
    setMode(mode === "login" ? "register" : "login");
  });

  function clearErrors() {
    document.querySelectorAll(".field-error").forEach((el) => (el.textContent = ""));
    $("form-error").hidden = true;
  }

  /* ตรวจฝั่ง client ก่อนส่ง (UX ดีขึ้น) — แต่ backend ยัง validate ซ้ำเสมอ */
  function validateClient(body) {
    const errors = {};
    if (!/^[A-Za-z0-9._-]{3,50}$/.test(body.username)) errors.username = "ใช้ a-z, 0-9, . _ - ความยาว 3-50 ตัว";
    if (mode === "register") {
      if (!/^\S+@\S+\.\S+$/.test(body.email || "")) errors.email = "รูปแบบอีเมลไม่ถูกต้อง";
      if (body.password.length < 8 || !/[A-Za-z]/.test(body.password) || !/\d/.test(body.password))
        errors.password = "อย่างน้อย 8 ตัว และมีทั้งตัวอักษรและตัวเลข";
    } else if (!body.password) {
      errors.password = "กรุณากรอกรหัสผ่าน";
    }
    return errors;
  }

  function showErrors(errors, general) {
    Object.entries(errors).forEach(([field, msg]) => {
      const el = document.querySelector(`.field-error[data-for="${field}"]`);
      if (el) el.textContent = msg;
    });
    if (general) {
      $("form-error").textContent = general;
      $("form-error").hidden = false;
    }
  }

  $("auth-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    clearErrors();
    const body = { username: $("username").value.trim(), password: $("password").value };
    if (mode === "register") {
      body.email = $("email").value.trim();
      body.full_name = $("full_name").value.trim() || null;
      body.role = selectedRole;
    }
    const errors = validateClient(body);
    if (Object.keys(errors).length) return showErrors(errors);

    await withLoading($("submit-btn"), async () => {
      try {
        if (mode === "register") {
          await apiPost("/register", body, { auth: false });
          showToast("✅ สมัครสมาชิกสำเร็จ กำลังเข้าสู่ระบบ...", 2000, "success");
        }
        const result = await apiPost("/login", { username: body.username, password: body.password }, { auth: false });
        saveSession(result.access_token, result.user);
        window.location.href = nextPage();
      } catch (err) {
        // 422: แสดง error ใต้ช่องที่ผิด, อื่นๆ แสดงรวมด้านบนปุ่ม
        if (err.code === "VALIDATION_ERROR" && Array.isArray(err.details)) {
          const fieldErrors = {};
          err.details.forEach((d) => { if (d.field) fieldErrors[d.field] = d.message; });
          showErrors(fieldErrors, Object.keys(fieldErrors).length ? null : err.message);
        } else {
          showErrors({}, errorMessage(err));
        }
      }
    }, mode === "register" ? "กำลังสมัคร..." : "กำลังเข้าสู่ระบบ...");
  });
</script>
</body>
</html>
