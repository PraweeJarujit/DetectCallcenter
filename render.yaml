# Render Blueprint — deploy ทั้งระบบขึ้น cloud ด้วยไฟล์เดียว (Week 11-12: Deployment)
# วิธีใช้: push repo ขึ้น GitHub -> https://dashboard.render.com -> New -> Blueprint -> เลือก repo นี้
# Render จะสร้าง PostgreSQL + backend (Docker) + frontend (static site) ให้อัตโนมัติ
databases:
  - name: voiceguard-db
    plan: free
    databaseName: detectcallcenter
    user: dcc_user

services:
  - type: web
    name: voiceguard-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voiceguard-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true          # Render สุ่ม secret ให้ ไม่ต้องเก็บใน git
      - key: CORS_ORIGINS
        value: https://voiceguard-web.onrender.com   # แก้ให้ตรงกับ URL frontend จริง
      - key: SEED_DEMO_DATA
        value: "true"                # demo สำหรับนำเสนอ — ระบบจริงให้ตั้งเป็น false
      - key: WEB_CONCURRENCY
        value: "1"

  - type: web
    name: voiceguard-web
    runtime: static
    rootDir: frontend
    staticPublishPath: .
    buildCommand: echo "static site — no build"
    routes:
      # ให้หน้าเว็บเรียก /api/... ได้เหมือนตอนรันด้วย nginx (same-origin)
      - type: rewrite
        source: /api/*
        destination: https://voiceguard-api-dz1i.onrender.com/api/*
      - type: redirect
        source: /
        destination: /pages/login.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'"
